name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    env:
      EXPO_NO_TELEMETRY: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Activate the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Run format, lint, type, test and build gates
        run: pnpm check:ci

      - name: Run secret and production dependency checks
        run: pnpm security

  deploy-staging-database:
    name: Deploy staging database
    runs-on: ubuntu-24.04
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_DB_URL_STAGING: ${{ secrets.SUPABASE_DB_URL_STAGING }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Activate the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply and verify versioned migrations in staging
        run: pnpm db:deploy:staging
