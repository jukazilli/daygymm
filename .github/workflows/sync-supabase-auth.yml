name: Sync Supabase Auth staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-auth-templates:
    name: Auth templates
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Synchronize confirmation and recovery templates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
        run: node scripts/sync-supabase-auth-templates.mjs
